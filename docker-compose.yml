services:
  web-app:
    build: .
    ports:
      - "80:80"
    networks:
      - webnet
    depends_on:
      - database
    restart: always

  database:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: bookstore_db
      MYSQL_USER: clarusway
      MYSQL_PASSWORD: Clarusway_1
    networks:
      - webnet
    volumes:
      - vol_data:/var/lib/mysql
networks:
  webnet:
    driver: bridge
volumes:
  vol_data: