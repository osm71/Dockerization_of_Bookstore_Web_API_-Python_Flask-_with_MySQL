services:
  web-app:
    build: .
    ports:
      - "80:80"
    networks:
      - webnet
    depends_on:
      - database
    restart: always

  database:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - webnet
    volumes:
      - vol_data:/var/lib/mysql
networks:
  webnet:
    driver: bridge
volumes:
  vol_data: